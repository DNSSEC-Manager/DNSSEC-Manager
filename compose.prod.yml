services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped

    command:
      # Dashboard
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Let's Encrypt
      - "--certificatesresolvers.letsencrypt.acme.email=${EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpChallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpChallenge.entrypoint=web"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"

    networks:
      - backend
      - traefik_proxy

    #healthcheck:
      #test: ["CMD", "traefik", "healthcheck", "--ping"]
      #interval: 20s
      #timeout: 5s
      #retries: 5
      #start_period: 20s

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      #- "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      #- "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_USER}:${TRAEFIK_AUTH}"
      - "traefik.http.routers.dashboard.service=api@internal"

  backend:
    image: ghcr.io/dnssec-manager/dnssec-manager:latest
    container_name: dnssecmanager-backend
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HTTP_PORTS: 8080
      DNS_SERVER_NAME: PowerDNS
      DNS_SERVER_API_URL: http://pdns:8081
      DNS_SERVER_API_KEY: ${PDNS_API_KEY}
      DNS_SERVER_NS1: ${DOMAIN_NS1}
      DNS_SERVER_NS2: ${DOMAIN_NS2}

    volumes:
      - app-data:/app/storage

    networks:
      - backend
      - traefik_proxy

    depends_on:
      - pdns

    #healthcheck:
      #test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      #interval: 15s
      #timeout: 5s
      #retries: 5
      #start_period: 25s

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dnssecmanager.rule=Host(`${BACKEND_HOST}`)"
      - "traefik.http.routers.dnssecmanager.entrypoints=websecure"
      - "traefik.http.routers.dnssecmanager.tls=true"
      - "traefik.http.routers.dnssecmanager.tls.certresolver=letsencrypt"
      - "traefik.http.services.dnssecmanager.loadbalancer.server.port=8080"

  pdns:
    image: pschiffe/pdns-mysql:4.8
    container_name: dnssecmanager-pdns
    restart: unless-stopped

    environment:
      PDNS_launch: gmysql
      PDNS_gmysql_host: db
      PDNS_gmysql_user: pdns
      PDNS_gmysql_password: ${PDNS_DB_PASSWORD}
      PDNS_gmysql_dbname: pdns
      PDNS_gmysql_dnssec: yes
      PDNS_api: yes
      PDNS_api_key: ${PDNS_API_KEY}
      PDNS_webserver: yes
      PDNS_webserver_address: 0.0.0.0
      PDNS_webserver_port: 8081
      PDNS_webserver_allow_from: 0.0.0.0/0
      PDNS_local_address: 0.0.0.0
      PDNS_local_port: 53
      PDNS_local_ipv6: '::'
      PDNS_local_ipv6_port: 53

    ports:
      - "53:53/tcp"
      - "53:53/udp"

    networks:
      - backend
      - traefik_proxy

    depends_on:
      - db

    #healthcheck:
      #test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/v1/servers/localhost"]
      #interval: 20s
      #timeout: 5s
      #retries: 10
      #start_period: 30s

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdns.rule=Host(`${PDNS_HOST}`)"
      - "traefik.http.routers.pdns.entrypoints=websecure"
      - "traefik.http.routers.pdns.tls=true"
      - "traefik.http.routers.pdns.tls.certresolver=letsencrypt"
      - "traefik.http.services.pdns.loadbalancer.server.port=8081"
      #- "traefik.http.routers.pdns.middlewares=pdns-auth"
      #- "traefik.http.middlewares.pdns-auth.basicauth.users=${TRAEFIK_USER}:${TRAEFIK_AUTH}"

  db:
    image: mariadb:11.8
    container_name: dnssecmanager-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pdns
      MYSQL_USER: pdns
      MYSQL_PASSWORD: ${PDNS_DB_PASSWORD}

    volumes:
      - pdns-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    networks:
      - backend

    #healthcheck:
      #test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      #interval: 20s
      #timeout: 5s
      #retries: 10
      #start_period: 40s

networks:
  backend:
    driver: bridge

  traefik_proxy:
    driver: bridge

volumes:
  letsencrypt:
  pdns-data:
  app-data:
